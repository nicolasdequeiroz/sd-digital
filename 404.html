<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Página não encontrada | SD Digital</title>
<link href="/assets/images/6433569aa31608f904c65bf5_Frame-124.svg" rel="shortcut icon" type="image/x-icon"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.gstatic.com" rel="preconnect" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: "Red Hat Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0e0e0e;
    color: #f5f5f5;
    text-align: center;
  }
  .wrap { max-width: 32rem; }
  .code {
    font-size: clamp(3.5rem, 14vw, 6rem);
    font-weight: 700;
    line-height: 1;
    margin: 0 0 .5rem;
    letter-spacing: -0.02em;
  }
  h1 {
    font-size: clamp(1.25rem, 5vw, 1.75rem);
    font-weight: 500;
    margin: 0 0 1rem;
  }
  p {
    font-size: 1rem;
    line-height: 1.6;
    color: #b5b5b5;
    margin: 0 0 2rem;
  }
  a.btn {
    display: inline-block;
    padding: .85rem 1.6rem;
    border-radius: 999px;
    background: #ff4d00;
    color: #fff;
    font-weight: 500;
    text-decoration: none;
    transition: opacity .15s ease;
  }
  a.btn:hover { opacity: .88; }
</style>
</head>
<body>
  <main class="wrap">
    <p class="code">404</p>
    <h1>Esta página não existe</h1>
    <p>O endereço que você acessou pode ter sido movido ou removido. Volte para a página inicial da SD Digital.</p>
    <a class="btn" href="/">Voltar para o início</a>
  </main>
</body>
</html>
